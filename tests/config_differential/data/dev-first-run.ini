;  Stormworks Head Tracking configuration
;  Decoupled look (head moves the view; mouse/keyboard still aim).

[Tracking]
Port=4242
EnableOnStartup=1
;  Yaw mode: 1 = horizon-locked yaw (default), 0 = camera-local
WorldSpaceYaw=1
YawSensitivity=1
PitchSensitivity=1
RollSensitivity=1
InvertYaw=0
InvertPitch=0
InvertRoll=0
;  Smoothing 0.0 = lightest, 1.0 = heaviest. Covers rotation and position.
;  The value is picked per connection from the packet source address:
;  LocalSmoothing for a tracker sending to 127.0.0.1 on this PC,
;  RemoteSmoothing for anything else, including a tracker on this PC
;  that sends to this machine's LAN address instead of 127.0.0.1.
LocalSmoothing=0
RemoteSmoothing=0.15

[Position]
PositionEnabled=1
PositionSensitivityX=1
PositionSensitivityY=1
PositionSensitivityZ=1
PositionLimitX=0.3
;  How far the view may move, in metres. Y is up and YDown is down.
PositionLimitY=0.2
PositionLimitYDown=0.2
PositionLimitZForward=0.4
PositionLimitZBack=0.1
InvertPositionX=0
InvertPositionY=0
InvertPositionZ=0

[Hotkeys]
;  Windows virtual key codes. End=toggle PageUp=cycle mode PageDown=yaw mode.
;  Chord alternatives Ctrl+Shift+Y / G / H are always active too.
ToggleKey=0x23
CycleModeKey=0x21
YawModeKey=0x22

[Advanced]
DataFreshnessMs=500
